name: Deploy console to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, or Pages can be left
# serving a half-uploaded build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The console consumes the SDK via `file:../sdk`, so the SDK must be
      # built first — `dist/` is not committed.
      - name: Build SDK
        working-directory: sdk
        run: npm ci && npm run build

      - name: Test SDK
        working-directory: sdk
        run: npm test

      - name: Install console
        working-directory: console
        run: npm ci

      - name: Test console
        working-directory: console
        run: npm test

      - name: Build console
        working-directory: console
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: console/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
